    margin-left: auto;
    background: var(--aws-orange);
    border: none;
    color: #232f3e;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 20px;

    font-size: 13px;

  .domain {
    background: #fff;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .domain h2 {
    color: var(--aws-dark);
    border-left: 5px solid var(--aws-orange);
    padding-left: 12px;
    margin: 0 0 6px;
    font-size: 18px;
  }
  .domain .sub { color: #666; font-size: 13px; margin: 0 0 14px; }
  .q {
    border-top: 1px solid #eee;
    padding: 16px 0;
  }
  .q:first-of-type { border-top: none; }
  .q .qt { font-weight: 600; margin-bottom: 10px; }
  .q .qt .num { color: var(--aws-orange); font-weight: 700; margin-right: 4px; }
  .opt {
    display: block;
    padding: 9px 12px;
    margin: 6px 0;
    border: 1.5px solid #d5d5d5;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
    background: #fff;
  }

  .opt .letter { font-weight: 700; margin-right: 8px; color: var(--aws-dark); }
  .opt.correct { border-color: var(--ok); background: #e6f4ea; }
  .opt.correct .letter { color: var(--ok); }
  .opt.wrong { border-color: var(--bad); background: #fce8e6; }
  .opt.wrong .letter { color: var(--bad); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .55; }
  .expl {
    display: none;
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    background: #f0f4f8;
    border-left: 4px solid var(--aws-dark);
  }
  .expl.show { display: block; }
  .expl .verdict { font-weight: 700; }
  .expl.ok { border-left-color: var(--ok); background: #e6f4ea; }
  .expl.ok .verdict { color: var(--ok); }
  .expl.bad { border-left-color: var(--bad); background: #fce8e6; }
  .expl.bad .verdict { color: var(--bad); }
  footer { text-align: center; color: #888; font-size: 12px; padding: 20px; }

      { q: "Which service routes events from various sources to different targets based on rules?", opts: ["Amazon EventBridge", "Amazon SNS", "AWS Step Functions", "Amazon SQS"], ans: 0, expl: "EventBridge = roteamento de eventos por regras." },
      { q: "Which service manages stateful workflows with retries between Lambda functions?", opts: ["AWS Step Functions", "Amazon EventBridge", "Amazon SQS", "Amazon SNS"], ans: 0, expl: "Step Functions = workflow com estado e retry." },
      { q: "Which service lets you create, publish, and manage RESTful APIs?", opts: ["Amazon API Gateway", "Amazon Route 53", "AWS Direct Connect", "Amazon CloudFront"], ans: 0, expl: "API Gateway = criar/publicar APIs." },
      { q: "Which service lets you run queries over data stored in S3 without loading it into a database?", opts: ["Amazon Athena", "Amazon Redshift", "Amazon RDS", "Amazon EMR"], ans: 0, expl: "Athena = query serverless no S3." },
      { q: "What is the main purpose of an ELB health check?", opts: ["To route traffic only to healthy instances", "To scale instances", "To encrypt traffic", "To reduce cost"], ans: 0, expl: "Health check = só manda tráfego pra instância saudável." },
      { q: "Deploying across multiple AZs primarily provides which benefit?", opts: ["High availability", "Lower storage cost", "Faster compute", "Data compression"], ans: 0, expl: "Múltiplas AZs = alta disponibilidade." },
      { q: "Which service helps you automate operational tasks like patching at scale?", opts: ["AWS Systems Manager", "Amazon CloudWatch", "AWS CloudFormation", "AWS Config"], ans: 0, expl: "Systems Manager = automação operacional." },

      { q: "Which service is a serverless data integration service for ETL?", opts: ["AWS Glue", "Amazon EMR", "Amazon Kinesis", "AWS DMS"], ans: 0, expl: "Glue = ETL serverless." },
      { q: "Which service captures and processes real-time streaming data for analytics?", opts: ["Amazon Kinesis", "Amazon SQS", "Amazon SNS", "Amazon Athena"], ans: 0, expl: "Kinesis = streaming." },
      { q: "Where does CloudFront typically get content from (its source)?", opts: ["An origin like S3 or EC2", "Route 53", "A VPC", "Direct Connect"], ans: 0, expl: "Origem do CloudFront = S3 ou EC2." },
      { q: "Which service provides a graph database?", opts: ["Amazon Neptune", "Amazon DynamoDB", "Amazon RDS", "Amazon ElastiCache"], ans: 0, expl: "Neptune = banco de grafos." },
      { q: "Which service is a fully managed NoSQL key-value store for low latency at any scale?", opts: ["Amazon DynamoDB", "Amazon Redshift", "Amazon Aurora", "Amazon Neptune"], ans: 0, expl: "DynamoDB = NoSQL chave-valor." },

      { q: "Which service transfers data between on-premises and AWS over the internet?", opts: ["AWS Storage Gateway", "AWS Snowball", "AWS Direct Connect", "AWS VPN"], ans: 0, expl: "Storage Gateway = ponte on-premises ↔ nuvem." },

      { q: "Which service is a petabyte-scale data warehouse?", opts: ["Amazon Redshift", "Amazon RDS", "Amazon DynamoDB", "Amazon Aurora"], ans: 0, expl: "Redshift = data warehouse." },
    ]
  },
];

const LETTERS = ["A", "B", "C", "D", "E"];
let answered = 0;
let correct = 0;

function buildQuiz() {
  const root = document.getElementById('quiz');
  let html = '';
  let qn = 0;
  DATA.forEach((domain, di) => {
    html += `<div class="domain"><h2>${domain.title}</h2><p class="sub">${domain.sub}</p>`;
    domain.questions.forEach((q, qi) => {
      qn++;
      const id = `q${di}-${qi}`;
      html += `<div class="q" id="${id}">`;
      html += `<div class="qt"><span class="num">Q${qn}.</span> ${q.q}</div>`;
      q.opts.forEach((opt, oi) => {
        html += `<div class="opt" data-di="${di}" data-qi="${qi}" data-oi="${oi}"><span class="letter">${LETTERS[oi]}.</span> ${opt}</div>`;
      });
      html += `<div class="expl" id="expl-${id}"></div>`;
      html += `</div>`;
    });
    html += `</div>`;
  });
  root.innerHTML = html;

  document.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const di = parseInt(el.dataset.di);
      const qi = parseInt(el.dataset.qi);
      const oi = parseInt(el.dataset.oi);
      answer(di, qi, oi, el);
    });
  });
}

function answer(di, qi, oi, clickedEl) {
  const q = DATA[di].questions[qi];
  const id = `q${di}-${qi}`;
  const container = document.getElementById(id);
  const opts = container.querySelectorAll('.opt');
  if (clickedEl.classList.contains('disabled')) return; // already answered

  const isCorrect = (oi === q.ans);
  answered++;
  if (isCorrect) correct++;

  // lock all options
  opts.forEach(el => el.classList.add('disabled'));
  // mark correct & wrong
  opts.forEach((el, idx) => {
    if (idx === q.ans) el.classList.add('correct');
    else el.classList.add('dim');
  });
  if (!isCorrect) clickedEl.classList.add('wrong');

  // show explanation
  const expl = document.getElementById('expl-' + id);
  expl.classList.add('show');
  expl.classList.add(isCorrect ? 'ok' : 'bad');
  expl.innerHTML = `<span class="verdict">${isCorrect ? '✅ Correto!' : '❌ Errado.'}</span> Resposta certa: <strong>${LETTERS[q.ans]}</strong>. ${q.expl}`;

  updateScore();
  expl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function updateScore() {
  const total = DATA.reduce((s, d) => s + d.questions.length, 0);
  document.getElementById('score').textContent = `Acertos: ${correct} / ${answered} (de ${total})`;
  const pct = answered ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('pct').textContent = `${pct}%`;
}

function resetQuiz() {
  answered = 0;
  correct = 0;
  buildQuiz();
  updateScore();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
updateScore();
</script>
